name: Refresh EveryPark data

# Rebuilds the whole dataset from the public sources and commits it.
# Nobody has to open a browser page for this — GitHub's runners have the
# network access that made the browser necessary in the first place.
on:
  schedule:
    - cron: "17 6 1 * *"      # 06:17 UTC on the 1st of each month
  workflow_dispatch:           # or run it by hand from the Actions tab
    inputs:
      skip_tiles:
        description: "Skip the tile rebuild (much faster; places only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests shapely mercantile mapbox-vector-tile pmtiles

      - name: Fetch every source
        run: python3 fetchsources.py --out raw

      - name: Build the place list
        run: python3 buildplaces.py --raw raw --data data -o data/places.json

      - name: Build the tile archive
        if: ${{ !inputs.skip_tiles }}
        run: |
          python3 maketiles.py stage raw/ep-*.geojson --zooms 6 7 8 9
          python3 maketiles.py stage raw/ep-*.geojson --zooms 10 11
          python3 maketiles.py stage raw/ep-*.geojson --zooms 12
          python3 maketiles.py stage raw/ep-*.geojson --zooms 13
          python3 maketiles.py stage raw/ep-*.geojson --zooms 14
          python3 maketiles.py pack -o data/everypark.pmtiles

      - name: Bump dataVersion so browsers pick up the new file
        run: |
          python3 - <<'PY'
          import re, time
          p = "config.js"
          s = open(p).read()
          stamp = time.strftime("%Y%m%d")
          s = re.sub(r'dataVersion:\s*"[^"]*"', f'dataVersion: "{stamp}"', s, count=1)
          open(p, "w").write(s)
          print("dataVersion ->", stamp)
          PY

      - name: Report what changed
        run: |
          python3 - <<'PY'
          import json, os
          d = json.load(open("data/places.json"))
          print(f"{len(d['places']):,} places, "
                f"{os.path.getsize('data/places.json')/1024/1024:.2f} MB")
          if os.path.exists("data/everypark.pmtiles"):
              print(f"tiles {os.path.getsize('data/everypark.pmtiles')/1024/1024:.1f} MB")
          PY

      - name: Commit
        run: |
          git config user.name  "everypark-bot"
          git config user.email "actions@github.com"
          git add data/places.json data/everypark.pmtiles config.js || true
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Refresh data from public sources"
            git push
          fi
