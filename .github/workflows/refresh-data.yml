name: Refresh EveryPark data

# Rebuilds the whole dataset from the public sources and commits it.
# Nobody has to open a browser page for this — GitHub's runners have the
# network access that made the browser necessary in the first place.
on:
  schedule:
    - cron: "17 6 1 * *"      # 06:17 UTC on the 1st of each month
  workflow_dispatch:           # or run it by hand from the Actions tab
    inputs:
      skip_tiles:
        description: "Skip the tile rebuild (much faster; places only)"
        type: boolean
        default: false
  # Git-based dispatch: committing data/refresh-request starts a full
  # refresh. Exists because the sandbox sessions that maintain this repo
  # can push over git but cannot reach the GitHub API to press the
  # workflow_dispatch button. (Push events have no inputs, so this path
  # always builds tiles — which is what a requested refresh wants anyway.)
  push:
    branches: [main]
    paths:
      - "data/refresh-request"

permissions:
  contents: write

# Shared with the publish workflow so the two can never write to
# data/ at the same time. A fast publish firing mid-refresh is exactly
# the race that killed run #4.
concurrency:
  group: everypark-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 90 was sized for Connecticut, where the whole run took ~65 minutes.
    # New York roughly quadruples the fetch area and triples the record
    # count, so 90 would abort partway through the tile build and leave
    # nothing committed. 350 is just under GitHub's own 360-minute ceiling
    # for a job; if a run ever approaches it, split the tile stage into a
    # second job rather than raising this further, because 360 is the wall.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests shapely mercantile mapbox-vector-tile pmtiles pillow

      - name: Fetch every source
        # --prev lets a flaky endpoint degrade to last refresh's copy of
        # that one section instead of aborting the whole hour. The fresh
        # pull is committed back to data/baked.json below so next month
        # always has something to degrade to.
        run: |
          python3 fetchsources.py --out raw --prev data/baked.json
          cp raw/baked.json data/baked.json

      # buildplaces.py overwrites data/places.json with a fresh list that
      # has no elevation on it, so last month's samples have to be put
      # somewhere before that happens or the reuse below finds nothing.
      - name: Keep last refresh's dataset for reuse
        run: cp data/places.json raw/places-prev.json || true

      - name: Build the place list
        run: python3 buildplaces.py --raw raw --data data -o data/places.json

      - name: Attach real boundaries and verify what counts as a park
        run: python3 verifyplaces.py --raw raw --data data --in data/places.json -o data/places.json

      # The ground does not move between refreshes. Carrying known
      # elevation and land cover forward means only genuinely new places
      # are sampled -- seconds instead of ~25 minutes when nothing new
      # arrived, and on the first New York run only New York is sampled.
      - name: Sample elevation and land cover
        run: |
          python3 enrichraster.py --in data/places.json \
                  --reuse-from raw/places-prev.json -o data/places.json

      - name: Build the tile archive
        if: ${{ !inputs.skip_tiles }}
        run: |
          python3 maketiles.py stage raw/ep-*.geojson --zooms 6 7 8 9
          python3 maketiles.py stage raw/ep-*.geojson --zooms 10 11
          python3 maketiles.py stage raw/ep-*.geojson --zooms 12
          python3 maketiles.py stage raw/ep-*.geojson --zooms 13
          python3 maketiles.py stage raw/ep-*.geojson --zooms 14
          python3 maketiles.py pack -o data/everypark.pmtiles

      # Tiles go to object storage rather than into git, because the cost
      # here is not the file's size but its permanence. A regenerated,
      # already-compressed binary deltas against nothing, so every refresh
      # adds its whole size to history forever: three tile revisions
      # (14.7 + 13.6 + 88.9 MiB) are most of why .git is 113 MB. Splitting
      # the archive per state would duck GitHub's 100 MiB per-file block
      # and leave that growth exactly where it is.
      #
      # Inert until the secrets exist, so a repo without them keeps
      # committing tiles the old way and nothing breaks.
      - name: Upload tiles to R2
        if: ${{ !inputs.skip_tiles && env.R2_BUCKET != '' }}
        env:
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejected the CRC32 checksums newer AWS SDKs send by
          # default; Cloudflare fixed that in Feb 2025, but this costs
          # nothing and the failure mode is a five-hour run dying on its
          # last step.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          set -euo pipefail
          aws s3 cp data/everypark.pmtiles "s3://$R2_BUCKET/everypark.pmtiles" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type application/octet-stream \
            --cache-control "public, max-age=300"
          echo "uploaded $(du -h data/everypark.pmtiles | cut -f1) to R2"

      - name: Bump dataVersion so browsers pick up the new file
        run: |
          python3 - <<'PY'
          import re, time
          p = "config.js"
          s = open(p).read()
          stamp = time.strftime("%Y%m%d")
          s = re.sub(r'dataVersion:\s*"[^"]*"', f'dataVersion: "{stamp}"', s, count=1)
          open(p, "w").write(s)
          print("dataVersion ->", stamp)
          # Keep the README headline honest too — generated numbers
          # belong to the pipeline, not to hand-editing.
          import json
          n = len(json.load(open("data/places.json"))["places"])
          line = f"*{n:,} places · updated {time.strftime('%B %-d, %Y')}*"
          r = open("README.md").read()
          r2 = re.sub(r"\*[\d,]+ places · updated [^*]+\*", line, r, count=1)
          if r2 != r:
              open("README.md", "w").write(r2)
              print("README ->", line)
          PY

      - name: Report what changed
        run: |
          python3 - <<'PY'
          import json, os
          d = json.load(open("data/places.json"))
          print(f"{len(d['places']):,} places, "
                f"{os.path.getsize('data/places.json')/1024/1024:.2f} MB")
          if os.path.exists("data/everypark.pmtiles"):
              print(f"tiles {os.path.getsize('data/everypark.pmtiles')/1024/1024:.1f} MB")
          PY

      - name: Commit
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          git config user.name  "everypark-bot"
          git config user.email "actions@github.com"
          git add data/places.json config.js \
                  data/research-audit.json data/baked.json README.md || true
          # Only track the archive in git while R2 is not carrying it.
          # Staging it in both places would keep the history growing and
          # defeat the point of the upload.
          if [ -z "${R2_BUCKET}" ]; then
            git add data/everypark.pmtiles || true
          fi
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Refresh data from public sources"
            # This job takes half an hour, and main can move while it
            # runs — run #4 spent 38 minutes fetching sources and
            # sampling elevation, then threw all of it away on a
            # rejected push. Rebase onto whatever landed meanwhile and
            # retry, so a commit arriving mid-run costs a few seconds
            # instead of the entire run.
            for attempt in 1 2 3; do
              if git push; then
                echo "pushed on attempt $attempt"
                exit 0
              fi
              echo "push rejected — rebasing onto origin/main and retrying"
              git pull --rebase --autostash origin main || exit 1
              sleep 5
            done
            echo "could not push after 3 attempts"
            exit 1
          fi

      # Runs AFTER the commit on purpose. If research stopped applying we
      # still want the refreshed data live rather than a month-old site —
      # but the run must go red so the failure email actually arrives.
      # Silent loss is the only failure this pipeline can't spot by
      # looking at its own output: the file still looks perfectly fine.
      - name: Guard the research overlay
        run: |
          python3 - <<'PY'
          import json, sys
          a = json.load(open("data/research-audit.json"))
          print(f"{a['matched']}/{a['entries']} researched places matched, "
                f"{a['rule_hits']:,} settled by {a['rules']} rules, "
                f"{a.get('researched_places', 0):,} carry provenance")
          bad = False
          # Not a failure: a rule scoped to a state this dataset does not
          # contain yet has nothing to have failed against. Printed rather
          # than swallowed, because after a refresh that DID pull that
          # state, a still-dormant rule means the scope never matched.
          for r in a.get("dormant_rules", []):
              print(f"::notice::Rule {r['id']!r} dormant — no "
                    f"{'/'.join(r.get('states') or [])} places in this build")
          for u in a.get("unmatched", []):
              print(f"::error::Research LOST — no place matches "
                    f"{u['name']!r} ({u.get('town')}). Add an `at` "
                    f"coordinate anchor to its match block.")
              bad = True
          for r in a.get("dead_rules", []):
              print(f"::error::Rule {r['id']!r} matched nothing — the "
                    f"field it keys on has changed: {r['match']}")
              bad = True
          if a.get("error"):
              print(f"::error::verified.json problem: {a['error']}")
              bad = True
          sys.exit(1 if bad else 0)
          PY
