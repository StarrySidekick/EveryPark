<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body { margin: 0; background: #223; }</style>
</head>
<body>
<script>
  // Offline determinism: every fetch fails, so the viewer falls back to
  // procedural terrain and a full-square island. That exercises the whole
  // renderer without any network, which is exactly what a regression
  // check wants — the same scene every run. The one exception: GNIS
  // name queries get a canned answer, so the label pass renders too.
  window.fetch = (url) => {
    if (String(url).includes("geonames")) return Promise.resolve({
      ok: true,
      json: () => Promise.resolve({ features: [
        { attributes: { gaz_name: "Test Hill", gaz_featureclass: "Summit" },
          geometry: { points: [[-73.4835, 41.4205]] } },
        { attributes: { gaz_name: "Mirror Lake", gaz_featureclass: "Lake" },
          geometry: { points: [[-73.4745, 41.4165]] } }
      ] })
    });
    // Canned NLCD raster: grassland ground with patches of wetland,
    // scrub, sand and crops, so every class-driven effect renders
    // offline (official NLCD palette colours).
    if (String(url).includes("mrlc.gov")) {
      const cv = document.createElement("canvas");
      cv.width = 128; cv.height = 128;
      const c = cv.getContext("2d");
      c.fillStyle = "rgb(223,223,194)"; c.fillRect(0, 0, 128, 128);    // grassland
      c.fillStyle = "rgb(104,171,95)";  c.fillRect(40, 10, 60, 50);    // forest
      c.fillStyle = "rgb(108,159,184)"; c.fillRect(84, 88, 44, 40);    // herb wetland
      c.fillStyle = "rgb(184,217,235)"; c.fillRect(60, 96, 24, 32);    // woody wetland
      c.fillStyle = "rgb(204,184,121)"; c.fillRect(0, 0, 34, 36);      // scrub
      c.fillStyle = "rgb(179,172,159)"; c.fillRect(104, 0, 24, 26);    // barren/sand
      c.fillStyle = "rgb(171,108,40)";  c.fillRect(0, 92, 40, 36);     // crops
      return new Promise(res => cv.toBlob(b =>
        res({ ok: true, blob: () => Promise.resolve(b) })));
    }
    return Promise.reject(new Error("offline harness"));
  };
  // The same determinism, for the one path the fetch stub above cannot
  // reach: `loadImage()` in iso.js fetches height tiles and satellite
  // imagery through `new Image()`, not `fetch()`, so overriding
  // window.fetch never touched it. On a machine with real internet
  // access — this one, unlike whatever ran the last green baseline —
  // that meant fetchHeightSample's terrarium tiles hit the real AWS
  // service and came back with real elevation, at real network latency,
  // instead of failing straight into the procedural fallback this
  // harness exists to guarantee. Two silent effects: check.mjs's tree
  // and rim counts drifted off the documented baseline while still
  // passing (real terrain instead of the synthetic island), and
  // parts.mjs's piece step/wrap failed outright — fetchHeightSample is
  // awaited before the arrow-wiring code runs, so a several-hundred-ms
  // real fetch raced past the test's fixed waits, and the piece-switch
  // read window.__isoPartRings while it still held the PREVIOUS piece's
  // value, double-counting one piece and going missing on another
  // ("rings lost in the split: 6 of 5 survive" was never a splitParts
  // bug — splitParts conserves rings by inspection).
  window.Image = function() {
    let _src = "";
    const im = { onload: null, onerror: null, crossOrigin: null,
                 addEventListener() {}, removeEventListener() {} };
    Object.defineProperty(im, "src", {
      get: () => _src,
      set: v => { _src = v; setTimeout(() => im.onerror && im.onerror(new Event("error")), 0); }
    });
    return im;
  };
</script>
<script src="../../iso.js"></script>
<script>
  window.openTest = (over) => EveryParkIso.open(Object.assign({
    name: "Test Park", lat: 41.42, lng: -73.48, acres: 220,
    type: "town", attrs: { relief: 130, elev: 150, cover: "open" }
  }, over || {}));
</script>
</body>
</html>
